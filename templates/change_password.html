<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Смена пароля</title>
    </head>
    <body>
        <a href="/profile/settings">Назад</a>
        <form action="/auth/change_password", method="POST">
            <input type="text", name="password", placeholder="Введите нынешний пароль", required>
            <input type="text", name="new_password", placeholder="Введите новый пароль", required>
            <button type="submit">Сменить пароль</button>
        </form>
    </body>
</html>
