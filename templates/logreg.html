<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Авторизация</title>
    </head>
    <body>
        {% if error %}
        <span>{{ error }}</span>
        {% endif %}
        <p>Привет</p>
        <a>Войти</a>
        <form action="/logreg/login" method="POST">
            <label for="user_type">Войти как:</label>
            <select id="user_type" name="user_type" required>
                <option value="seller">Продавец</option>
                <option value="client">Покупатель</option>
            </select>
            <input type="text", name="login", placeholder="Логин", required>
            <input type="text", name="password", placeholder="Пароль", required>
            <button type="submit">Войти</button>
        </form>
        <a>Зарегистрироваться</a>
        <form action="/logreg/registration" method="POST">
            <label for="user_type">Зарегистрироваться как</label>
            <select id="user_type" name="user_type" required>
                <option value="seller">Продавец</option>
                <option value="Клиент">Покупатель</option>
            </select>
            <input type="text", name="name", placeholder="Имя", required>
            <input type="text", name="surname", placeholder="Фамилия", required>
            <input type="text", name="login", placeholder="Логин", required>
            <input type="password", name="password", placeholder="Пароль", required>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </body>
</html>
