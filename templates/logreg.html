<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Авторизация</title>
    </head>
    <style>
    :root {
        --bg: #0f1117;
        --card: #171a23;
        --card-2: #1e222d;
        --border: #2a2f3c;
        --text: #e6e8ee;
        --muted: #8b91a3;
        --accent: #5b8cff;
        --accent-hover: #4a7af0;
        --danger: #ff5b6a;
        --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2040 0%, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        padding: 32px 16px;
        line-height: 1.5;
    }

    body > * { max-width: 460px; margin-left: auto; margin-right: auto; }

    body > span:first-of-type {
        display: block;
        background: rgba(255, 91, 106, .12);
        border: 1px solid rgba(255, 91, 106, .4);
        color: var(--danger);
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 14px;
        margin-bottom: 20px;
    }

    body > p {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
        margin-top: 8px;
    }

    body > a {
        display: block;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--muted);
        margin: 28px 0 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
    }

    body > form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
    }

    body > form label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
        margin-bottom: -4px;
    }

    body > form select,
    body > form input {
        font-family: inherit;
        font-size: 14px;
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card-2);
        color: var(--text);
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }

    body > form select:focus,
    body > form input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(91, 140, 255, .18);
    }

    body > form input::placeholder { color: var(--muted); }

    body > form button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: all .15s ease;
        margin-top: 4px;
    }

    body > form button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    body > form button:active { transform: scale(.98); }

    @media (max-width: 600px) {
        body { padding: 20px 12px; }
        body > p { font-size: 24px; }
    }
</style>
    <body>
        {% if error %}
        <span>{{ error }}</span>
        {% endif %}
        <p>Привет</p>
        <a>Войти</a>
        <form action="/logreg/login" method="POST">
            <label for="user_type">Войти как:</label>
            <select id="user_type" name="user_type" required>
                <option value="seller">Продавец</option>
                <option value="client">Покупатель</option>
            </select>
            <input type="text", name="login", placeholder="Логин", required>
            <input type="text", name="password", placeholder="Пароль", required>
            <button type="submit">Войти</button>
        </form>
        <a>Зарегистрироваться</a>
        <form action="/logreg/registration" method="POST">
            <label for="user_type">Зарегистрироваться как</label>
            <select id="user_type" name="user_type" required>
                <option value="seller">Продавец</option>
                <option value="Клиент">Покупатель</option>
            </select>
            <input type="text", name="name", placeholder="Имя", required>
            <input type="text", name="surname", placeholder="Фамилия", required>
            <input type="text", name="login", placeholder="Логин", required>
            <input type="password", name="password", placeholder="Пароль", required>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </body>
</html>
