<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Смена имени и фамилии</title>
    </head>
    <style>
    :root {
        --bg: #0f1117;
        --card: #171a23;
        --card-2: #1e222d;
        --border: #2a2f3c;
        --text: #e6e8ee;
        --muted: #8b91a3;
        --accent: #5b8cff;
        --accent-hover: #4a7af0;
        --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2040 0%, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        padding: 32px 16px;
        line-height: 1.5;
    }

    body > * { max-width: 460px; margin-left: auto; margin-right: auto; }

    body > form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
    }

    body > form input {
        font-family: inherit;
        font-size: 14px;
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card-2);
        color: var(--text);
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }

    body > form input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(91, 140, 255, .18);
    }

    body > form input::placeholder { color: var(--muted); }

    body > form button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: all .15s ease;
        margin-top: 8px;
    }

    body > form button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    body > form button:active { transform: scale(.98); }

    @media (max-width: 600px) {
        body { padding: 20px 12px; }
        body > form { padding: 18px; }
    }
</style>
    <body>
        <form action="/profile/settings/change_ns/confirm_change", method="POST">
            <input type="text", name="name", value="{{ user.name }}", placeholder="Новое имя", required>
            <input type="text", name="surname", value="{{ user.surname }}", placeholder="Новая фамилия", required>
            <button type="submit">Сменить</button>
        </form>
    </body>
</html>
