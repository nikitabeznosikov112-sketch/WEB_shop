<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Настройки</title>
    </head>
    <style>
    :root {
        --bg: #0f1117;
        --card: #171a23;
        --border: #2a2f3c;
        --text: #e6e8ee;
        --muted: #8b91a3;
        --accent: #5b8cff;
        --accent-hover: #4a7af0;
        --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2040 0%, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        padding: 32px 16px;
        line-height: 1.5;
    }

    body > * { max-width: 820px; margin-left: auto; margin-right: auto; }

    body > form {
        display: block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 14px;
    }

    body > form button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: all .15s ease;
    }

    body > form:nth-of-type(2) button {
        background: var(--card);
        border-color: var(--border);
        color: var(--text);
    }

    body > form button:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
    body > form:nth-of-type(2) button:hover { background: var(--card); border-color: var(--accent); color: var(--accent); }
    body > form button:active { transform: scale(.97); }

    @media (max-width: 600px) {
        body { padding: 20px 12px; }
        body > form button { width: 100%; }
    }
</style>

    <body>
        <form action="/profile/settings/change_ns", method="POST">
            <button type="submit">Сменить имя и фамилию</button>
        </form>
        <form action="profile/settings/change_password", method="POST">
            <button type="submit">Сменить</button>
        </form>
    </body>
</html>
